<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritmo Constante - Plataforma de Estudos</title>
    <script>
      // GitHub Pages redireciona para 404.html quando uma rota não existe
      // Este script redireciona para index.html para que o React Router possa lidar com a rota
      const path = window.location.pathname;
      
      // Detecta o base path (ex: /ritmo-constante)
      // Se o path contém /ritmo-constante, usa esse como base
      const basePath = path.includes('/ritmo-constante') ? '/ritmo-constante' : '';
      
      // Remove /404.html do path se estiver presente
      const cleanPath = path.replace(/\/404\.html$/, '');
      
      // Constrói o caminho de redirecionamento
      const redirectPath = basePath + '/index.html' + cleanPath.replace(basePath, '') + window.location.search + window.location.hash;
      
      window.location.replace(redirectPath);
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
