<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritmo Constante - Plataforma de Estudos</title>
    <script>
      // GitHub Pages redireciona para 404.html quando uma rota não existe
      // Este script redireciona para index.html para que o React Router possa lidar com a rota
      const path = window.location.pathname;
      const basePath = path.split('/').slice(0, -1).join('/') || '/';
      window.location.replace(basePath + '/index.html' + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
